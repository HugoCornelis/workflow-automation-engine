---
command: bin/vigilia command-correct --help
command_tests:
- description: Is a help message given (command-correct)?
  exit_code: 0
  read: |+

    bin/vigilia command-correct <options> <error-report-directory>

    Correct an existing command's expected output based on the information in the given error report directory.

    Options:
        --convert-seen-0d-0a-to-0a-newlines  Convert seen 0x0d 0x0a to 0x0a newlines.
        --help                               Show this help message.
        --yaml-work-around                   Work around a yaml output problem with the Expect module, the default value of this option is true, use --no-yaml-work-around to disable.

description: Is a help message given (command-correct)?
