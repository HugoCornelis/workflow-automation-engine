---
command: >-
  rm -f /tmp/workflow-openai-missing-token-39; output=$(feature-testing-workflow builtin ai_set_api_token /tmp/workflow-openai-missing-token-39 2>&1); status=$?; printf '%s' "$output" | grep -F 'feature-testing-workflow: *** Error: OpenAI API token file does not exist: /tmp/workflow-openai-missing-token-39' >/dev/null && printf '%s\n' "$status"
command_tests:
  - description: Is a nonexistent token file rejected?
    read: |+2
      2
    exit_code: 0
    white_space: convert seen 0a to 0d 0a newlines
description: rejecting a nonexistent OpenAI API token file
