---
command: feature-testing-workflow features command_concatenation tmux_cd --interactions
command_tests:
  - description: a tmux-based role receives the command array as one ';'-concatenated line
    read: |2
          ROLE: 'tmux_cd'

          'echo one ; echo two ; echo three'
    white_space: convert seen 0a to 0d 0a newlines
description: a tmux-based role receives the command array as one ';'-concatenated line
